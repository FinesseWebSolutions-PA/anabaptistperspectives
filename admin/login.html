<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Sign in · Perspectives Studio</title>
  <link rel="icon" href="/assets/brand-mark.svg">
  <link rel="stylesheet" href="/admin/login.css">
  <script defer src="/admin/login.js"></script>
</head>
<body>
  <header class="brand-header"><a href="/" aria-label="Anabaptist Perspectives home"><img src="/assets/logo.svg" alt="Anabaptist Perspectives" width="266" height="70"></a><a class="back-link" href="/">Back to the website <span aria-hidden="true">↗</span></a></header>
  <main class="auth-layout">
    <aside class="welcome" aria-label="Perspectives Studio">
      <div class="studio-tag"><span aria-hidden="true"></span> PERSPECTIVES STUDIO</div>
      <div class="welcome-copy"><h1>A home for<br>your stories.</h1><p>One simple place to create, edit, and share the perspectives that matter.</p></div>
      <img class="watermark" src="/assets/brand-mark.svg" alt="" aria-hidden="true">
      <p class="welcome-foot">Made for the people behind the stories.</p>
    </aside>
    <section class="auth-card" aria-label="Administrator sign in">
      <div class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="4"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
      <div id="auth-content"><h2>Just a moment…</h2><p class="intro">Getting your studio ready.</p></div>
      <noscript><p class="message error">Please enable JavaScript to sign in to the studio.</p></noscript>
    </section>
  </main>
  <footer class="auth-footer">Anabaptist Perspectives <span aria-hidden="true">·</span> Editorial studio</footer>
</body>
</html>
